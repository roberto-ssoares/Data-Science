[project]
name = "fraud-graph-analytics"
version = "0.1.0"
description = "MVP de prevenção a fraudes transacionais com Knowledge Graph, regras explicáveis e CRISP-DM+."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pandas",
    "polars",
    "pyarrow",
    "numpy",
    "faker",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "networkx",
    "neo4j",
    "graphdatascience",
    "python-dotenv",
    "jupyterlab",
    "ipykernel",
    "streamlit",
    "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []


